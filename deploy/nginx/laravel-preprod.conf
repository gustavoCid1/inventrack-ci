# Sitio Nginx para el ambiente de PREPRODUCCIÓN
# Copiar a /etc/nginx/sites-available/ y enlazar en sites-enabled/
server {
    listen 80;
    server_name preprod.local;                       # <-- tu dominio o IP de pruebas
    root /var/www/inventrack-preprod/current/public;    # apunta a la versión activa
    index index.php;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Robots-Tag "noindex, nofollow";     # no indexar preproducción

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # $realpath_root resuelve el symlink "current" -> cada release usa su propio OPcache
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Bloquea archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
